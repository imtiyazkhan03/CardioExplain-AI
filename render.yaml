services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: cardioexplain-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/cardioexplain.db
      - key: LLM_PROVIDER
        value: deterministic
      - key: CORS_ORIGINS
        value: "*"

  # 2. React 19 Frontend Static Site
  - type: web
    name: cardioexplain-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cardioexplain-backend
          property: url
