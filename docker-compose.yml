version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cardioexplain-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./cardioexplain.db
      - LLM_PROVIDER=deterministic
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/reports:/app/reports
      - ./ml/models:/ml/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cardioexplain-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
